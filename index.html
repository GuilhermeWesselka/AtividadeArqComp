<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Conceitos de Arquitetura Computacional</title>
</head>
<body>
    <header class="cabecalho">
        <div class="chip-logo" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="16" y="16" width="32" height="32" rx="3"/>
                <rect x="26" y="26" width="12" height="12" rx="1"/>
                <path d="M24 8v8M32 8v8M40 8v8M24 48v8M32 48v8M40 48v8M8 24h8M8 32h8M8 40h8M48 24h8M48 32h8M48 40h8"/>
            </svg>
        </div>
        <h1>Palavras Cruzadas</h1>
        <p class="subtitulo">Arquitetura de Computadores</p>
    </header>

    <main class="conteudo">
        <section id="tabuleiro" class="tabuleiro" aria-label="Tabuleiro de palavras cruzadas">
            <div id="grade" class="grade"></div>
        </section>

        <aside id="dicas" class="dicas" aria-label="Dicas">
            <h2>Dicas</h2>
            <p class="dicas-aviso">Sem acentos e sem espaços</p>

            <label class="rotulo-dicas" for="seletor-dicas">Escolha uma dica</label>
            <div class="campo-dicas">
                <select id="seletor-dicas" class="seletor-dicas">
                    <option value="" selected>Selecione uma dica...</option>
                    <optgroup label="Horizontais">
                        <option value="H1">1 &middot; Parte do processador que decodifica cada instrução e coordena os demais componentes. (2 letras)</option>
                        <option value="H2">2 &middot; Recurso que permite a um periférico ler ou gravar na memória sem a CPU intermediar cada dado. (3 letras)</option>
                        <option value="H5">5 &middot; Memória pequena e muito rápida que guarda cópias de dados usados com frequência pela CPU. (5 letras)</option>
                        <option value="H7">7 &middot; Memórias internas da CPU, usadas para guardar temporariamente os valores em processamento. (12 letras)</option>
                        <option value="H8">8 &middot; Memória gravada pelo fabricante, responsável por guardar as instruções iniciais do computador. (3 letras)</option>
                        <option value="H9">9 &middot; Componente que busca, interpreta e executa as instruções de um programa. (3 letras)</option>
                        <option value="H10">10 &middot; Memória não volátil regravável, presente em pendrives e SSDs. (5 letras)</option>
                    </optgroup>
                    <optgroup label="Verticais">
                        <option value="V1">1 &middot; Circuito do processador onde são feitas as operações aritméticas e lógicas. (3 letras)</option>
                        <option value="V3">3 &middot; Armazenamento permanente e de grande capacidade, como HDs e SSDs. (14 letras)</option>
                        <option value="V4">4 &middot; Memória não volátil que pode ser apagada e regravada eletricamente, usada para guardar configurações. (6 letras)</option>
                        <option value="V6">6 &middot; Conjunto de vias que leva à memória o endereço da posição que será acessada. (10 letras)</option>
                        <option value="V7">7 &middot; Memória volátil que mantém os programas e dados em uso enquanto o computador está ligado. (3 letras)</option>
                    </optgroup>
                </select>
            </div>
        </aside>
    </main>

    <footer class="rodape">
        <p>Desenvolvido por Guilherme Wesselka &mdash; 1ADSB</p>
    </footer>
</body>
</html>
